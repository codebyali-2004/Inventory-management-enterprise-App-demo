<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>

{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Navbar -->




<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-primary text-white rounded-top-4">

<h2 class="fw-bold mb-0">
Add New Product
</h2>

<p class="mb-0 small">
Inventory Management System
</p>

</div>

<div class="card-body p-4">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-4">

<label class="form-label fw-semibold">

Product Name

</label>

{{ form.product_name}}

</div>

<div class="mb-4">

<label class="form-label fw-semibold">

Category

</label>

{{ form.category }}

</div>

<div class="mb-4">

<label class="form-label fw-semibold">

Quantity

</label>

{{ form.quantity }}

</div>

<div class="mb-4">

<label class="form-label fw-semibold">

Price

</label>

{{ form.price }}

</div>

<div class="mb-4">

<label class="form-label fw-semibold">

Upload Image

</label>

{{ form.image }}

</div>

<div class="d-grid">

<button class="btn btn-success btn-lg rounded-pill">

Save Product

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>



{% endblock %}
</body>
</html>
